name: pawnsystem

services:
  pawnsystemdb:
    image: postgres:17
    container_name: pawnsystemcontainer
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the project .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the project .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migration:
    profiles: ["migration"]
    build:
      context: ..
      dockerfile: docker/migration.Dockerfile
    environment:
      DB_HOST: pawnsystemdb
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
    depends_on:
      pawnsystemdb:
        condition: service_healthy
    volumes:
      - ../migration-data/source:/app/migration-data/source:ro
      - ../migration-data/exports:/app/migration-data/exports
      - ../migration-data/reports:/app/migration-data/reports

volumes:
  postgres_data:
